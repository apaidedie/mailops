name: SonarCloud Scan

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Analysis is best-effort: missing/invalid Sonar secrets must not block publish CI.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require Sonar token
        id: sonar_auth
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN is not configured; skipping SonarCloud scan."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.sonar_auth.outputs.skip != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.sonar_auth.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary :all: -r requirements.txt
          python -m pip install coverage

      - name: Run tests with coverage
        if: steps.sonar_auth.outputs.skip != 'true'
        run: |
          coverage run -m unittest discover -s tests -v
          coverage xml

      - name: SonarCloud Scan
        if: steps.sonar_auth.outputs.skip != 'true'
        uses: sonarsource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SonarCloud SaaS host must include scheme. Do not pass a bare path from secrets.
          SONAR_HOST_URL: https://sonarcloud.io
